<!DOCTYPE html>
<!-- build: v4.1 · corporate treasure -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Карта сокровищ · Ivideon</title>
<style>
:root{
  /* Ivideon core */
  --iv-blue:#2568db;--iv-blue-dark:#1d4ed8;--iv-blue-soft:#eff6ff;--iv-navy:#0f172a;--iv-navy-2:#172554;
  /* Neutral UI */
  --white:#fff;--page-bg:#f8fafc;--surface:#fff;--surface-soft:#f8fafc;--line:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--disabled:#94a3b8;
  /* Treasure layer */
  --parchment:#e9d8a6;--parchment-light:#f9f0e2;--parchment-dark:#d6bd84;--sand:#f1e9d2;
  --map-ink:#76552e;--map-line:#b38a52;--gold:#d4af37;--gold-light:#c9b06a;--bronze:#9a622f;
  /* System */
  --success:#22c55e;--success-soft:#ecfdf3;--warning:#f59e0b;--warning-soft:#fffbeb;
  --danger:#ef4444;--danger-soft:#fef2f2;--purple:#8b5cf6;--purple-soft:#f5f3ff;
  /* Shadows */
  --shadow-sm:0 4px 14px rgba(15,23,42,.055);--shadow-md:0 12px 30px rgba(15,23,42,.09);--shadow-lg:0 22px 54px rgba(15,23,42,.14);
  /* Type */
  --font-xs:11px;--font-sm:12px;--font-body:14px;--font-body-lg:16px;--font-h3:18px;--font-h2:22px;--font-h1:clamp(28px,4vw,42px);
  --font-ui:Manrope,"Avenir Next",Avenir,"Segoe UI",Arial,sans-serif;
  /* Metrics */
  --content-max:1120px;--radius-sm:7px;--radius-md:10px;--radius-lg:12px;--radius-xl:14px;
}
body[data-theme="dark"]{
  --white:#062a44;--page-bg:#071421;--surface:#062a44;--surface-soft:#07243a;--line:#164b6d;
  --text:#edf1f6;--muted:#afc3d1;--disabled:#5f7d95;--iv-blue-soft:#0b3a5c;
  --parchment:#2f2818;--parchment-light:#392f1c;--parchment-dark:#241e12;--sand:#332b1a;
  --map-ink:#e6d4ac;--map-line:#8a6c42;--purple-soft:#211f42;--success-soft:#10301a;--warning-soft:#2c2413;--danger-soft:#3a1119;
  --shadow-sm:0 6px 18px rgba(0,0,0,.32);--shadow-md:0 14px 36px rgba(0,0,0,.4);--shadow-lg:0 24px 64px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;font-family:var(--font-ui);font-size:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased;
  background:radial-gradient(circle at 100% 0%,rgba(0,149,255,.08),transparent 38%),var(--page-bg);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,input,select,textarea{font-family:inherit;font-size:var(--font-body-lg);color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--iv-blue);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* ---- decorative cartographic edge pattern (very light, non-interactive) ---- */
.map-pattern{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;
  background-image:
    radial-gradient(circle at 8% 18%,transparent 38px,var(--map-line) 39px,transparent 40px),
    radial-gradient(circle at 92% 78%,transparent 54px,var(--map-line) 55px,transparent 56px),
    repeating-linear-gradient(58deg,transparent 0 78px,var(--map-line) 78px 79px);
  background-repeat:no-repeat,no-repeat,repeat;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 62%)}
/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 16px;
  border:1px solid transparent;border-radius:var(--radius-md);font-size:13.5px;font-weight:800;line-height:1.2;
  transition:background .16s,border-color .16s,color .16s,transform .16s,box-shadow .16s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px;flex:0 0 18px}
.btn-primary{background:var(--iv-blue);color:#fff;box-shadow:0 8px 18px rgba(0,149,255,.20)}
.btn-primary:hover:not(:disabled){background:var(--iv-blue-dark)}
.btn-secondary,.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--line)}
.btn-secondary:hover:not(:disabled),.btn-ghost:hover:not(:disabled){border-color:var(--iv-blue);color:var(--iv-blue-dark)}
.btn-dark,.btn-blue{background:var(--iv-navy);color:#fff}
.btn-dark:hover:not(:disabled),.btn-blue:hover:not(:disabled){background:var(--iv-navy-2)}
.btn-gold{background:var(--gold);color:#2a1f00}
.btn-danger{background:var(--danger-soft);color:var(--danger);border-color:rgba(228,0,43,.25)}
.btn-danger:hover:not(:disabled){background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-sm{min-height:38px;padding:9px 13px;font-size:12.5px}
.btn-icon{min-height:44px;width:44px;padding:0;border-radius:var(--radius-md);background:var(--surface);border-color:var(--line);color:var(--muted)}
.btn-icon:hover{color:var(--iv-blue);border-color:var(--iv-blue)}
/* ---- surfaces ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:16px;box-shadow:var(--shadow-sm);min-width:0}
.panel-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:var(--font-h3);font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
.panel-title>svg{width:18px;height:18px;flex:0 0 18px;color:var(--iv-navy)}
.panel-sub{font-size:13px;line-height:1.55;color:var(--muted);margin-bottom:16px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:var(--font-xs);font-weight:800;letter-spacing:.02em}
.badge svg{width:13px;height:13px}
.badge-active{background:var(--success-soft);color:#177f33}
.badge-gold{background:rgba(217,168,0,.16);color:#7d6100}
.badge-blue{background:var(--iv-blue-soft);color:var(--iv-blue-dark)}
.badge-muted{background:var(--surface-soft);color:var(--muted)}
.badge-purple{background:var(--purple-soft);color:#3d36a0}
body[data-theme="dark"] .badge-gold{color:var(--gold-light)}
body[data-theme="dark"] .badge-active{color:#7ee29a}
body[data-theme="dark"] .badge-purple{color:#b0a9f2}

/* ===================== MAP 8x8 ===================== */
.map-frame{position:relative;display:block;width:max-content;max-width:none;margin:0 auto;padding:11px;border-radius:var(--radius-lg);
  border:1px solid var(--parchment-dark);box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.5);
  background:
    radial-gradient(circle at 22% 24%,rgba(186,149,99,.16),transparent 44%),
    radial-gradient(circle at 80% 78%,rgba(186,149,99,.13),transparent 46%),
    linear-gradient(150deg,var(--parchment-light),var(--parchment))}
.map-frame:before{content:"";position:absolute;inset:6px;border-radius:var(--radius-md);pointer-events:none;
  border:1px dashed rgba(186,149,99,.5)}
.map-rose{position:absolute;right:16px;bottom:14px;width:52px;height:52px;opacity:.16;pointer-events:none;color:var(--map-ink)}
.map-rose svg{width:100%;height:100%}
.brd{position:relative;border-collapse:separate;border-spacing:2px;width:max-content;table-layout:fixed}
.brd td,.brd th{padding:0;border:0;text-align:center;vertical-align:middle}
.brd th{height:22px;min-width:22px;color:var(--map-ink);font-size:var(--font-sm);font-weight:900;letter-spacing:.04em}
.cell{width:clamp(42px,4vw,50px);height:clamp(42px,4vw,50px);min-width:clamp(42px,4vw,50px);min-height:clamp(42px,4vw,50px);position:relative;border-radius:4px;
  border:1px solid rgba(186,149,99,.55);background:linear-gradient(150deg,rgba(255,255,255,.5),rgba(255,255,255,.14));
  transition:transform .16s,box-shadow .16s,background .16s}
/* 16.1 closed */
.cell:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;
  background:var(--map-line);opacity:.42}
.cell.is-open:after,.cell.has-content:after{display:none}
/* 16.2 selected */
.cell.is-selected{box-shadow:0 0 0 2px var(--iv-blue),0 0 0 6px rgba(0,149,255,.18)}
/* 16.3 empty */
.cell.st-empty{background:linear-gradient(150deg,rgba(121,89,54,.14),rgba(121,89,54,.07));border-color:rgba(121,89,54,.3)}
.cell.st-empty .cell-mark{color:var(--map-ink);opacity:.62}
/* 16.4 fragment */
.cell.st-fragment{background:linear-gradient(150deg,rgba(242,212,107,.62),rgba(217,168,0,.34));border-color:rgba(166,106,50,.5)}
.cell.st-fragment .cell-mark{color:#6d4f06}
/* 16.5 complete */
.cell.st-complete{background:linear-gradient(150deg,var(--gold-light),rgba(217,168,0,.62));
  border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 6px 16px rgba(217,168,0,.28)}
.cell.st-complete .cell-mark{color:#5b4400}
.cell.st-complete:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 62%);
  background-size:280% 100%;animation:shimmer 3.4s ease-in-out infinite}
@keyframes shimmer{0%,72%{background-position:120% 0}100%{background-position:-60% 0}}
/* 16.6 find */
.cell.st-find{background:linear-gradient(150deg,rgba(77,73,190,.34),rgba(77,73,190,.18));border-color:rgba(77,73,190,.5)}
.cell.st-find .cell-mark{color:#3d36a0}
/* 16.7 fragment + find: corner badge over the treasure state */
.cell-badge{position:absolute;right:-4px;top:-4px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  background:var(--purple);color:#fff;box-shadow:0 2px 6px rgba(0,29,50,.28);border:1.5px solid var(--surface)}
.cell-badge svg{width:11px;height:11px}
.cell-badge.tone-gold{background:var(--gold);color:#3a2a00}
.cell-badge.tone-green{background:var(--success);color:#04310f}
/* 16.8 disabled */
.cell.is-disabled{opacity:.45;cursor:not-allowed}
.cell.is-disabled .cell-lock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:15px;height:15px;color:var(--map-ink)}
.cell-mark{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:clamp(20px,2.4vw,26px);height:clamp(20px,2.4vw,26px)}
.cell-mark svg{width:100%;height:100%;display:block}
.cell-who{display:none;position:absolute;left:4px;right:4px;bottom:4px;width:max-content;max-width:calc(100% - 8px);margin:0 auto;
  padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.72);color:#4a381a;
  font-size:9px;line-height:1.25;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.st-complete .cell-who{background:rgba(255,255,255,.8)}
.cell.st-find .cell-who{background:rgba(255,255,255,.82);color:#3d36a0}
.cell.is-actionable{cursor:pointer}
.cell.is-actionable:hover,.cell:focus-visible{outline:none;box-shadow:0 0 0 2px var(--iv-blue),0 8px 18px rgba(0,29,50,.16);transform:translateY(-2px)}
.cell.is-open{cursor:help}
.map-scroll{max-width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.map-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.map-legend span{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);
  border-radius:var(--radius-sm);background:var(--surface);font-size:var(--font-sm);color:var(--muted);font-weight:600}
.map-legend i{width:14px;height:14px;flex:0 0 14px;border-radius:4px;border:1px solid rgba(166,106,50,.4)}
.lg-empty{background:linear-gradient(150deg,rgba(121,89,54,.3),rgba(121,89,54,.16))}
.lg-fragment{background:linear-gradient(150deg,rgba(242,212,107,.9),rgba(217,168,0,.6))}
.lg-complete{background:var(--gold);border-color:var(--gold)}
.lg-find{background:linear-gradient(150deg,rgba(77,73,190,.6),rgba(77,73,190,.34));border-color:rgba(77,73,190,.5)}
/* ===================== KPI ===================== */
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{display:flex;align-items:center;gap:10px;min-height:74px;padding:11px 13px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.kpi-ico{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:var(--radius-md);
  background:var(--iv-blue-soft);color:var(--iv-blue-dark)}
.kpi-ico svg{width:18px;height:18px}
.kpi-ico.tone-gold{background:rgba(217,168,0,.14);color:#8a6d00}
.kpi-ico.tone-purple{background:var(--purple-soft);color:var(--purple)}
.kpi-ico.tone-sand{background:rgba(186,149,99,.18);color:var(--bronze)}
body[data-theme="dark"] .kpi-ico.tone-gold{color:var(--gold-light)}
.kpi-body{min-width:0}
.kpi-label{font-size:var(--font-xs);font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi-value{font-size:21px;font-weight:900;letter-spacing:-.03em;line-height:1.12;margin-top:3px;overflow-wrap:anywhere}
.kpi-value small{font-size:12px;font-weight:800;color:var(--muted)}
.kpi-meta{font-size:var(--font-sm);color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
/* ===================== treasure cards ===================== */
.treasure-list{display:grid;gap:8px;min-width:0}
.tcard{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;
  padding:10px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface)}
.tcard.is-found{border-color:var(--gold);background:linear-gradient(150deg,rgba(242,212,107,.16),var(--surface))}
.tcard-ico{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--radius-md);
  background:rgba(186,149,99,.16);color:var(--bronze)}
.tcard.is-found .tcard-ico{background:rgba(217,168,0,.2);color:#8a6d00}
.tcard-ico svg{width:22px;height:22px}
.tcard-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tcard-name{font-size:var(--font-body);font-weight:800;overflow-wrap:anywhere}
.tcard-size{font-size:var(--font-sm);color:var(--muted)}
.tcard-prize{font-size:13px;margin-top:5px;overflow-wrap:anywhere}
.tcard-prize b{font-weight:800}
.seg{display:flex;gap:3px;margin-top:8px}
.seg i{height:6px;flex:1;border-radius:3px;background:var(--surface-soft);border:1px solid var(--line)}
.seg i.on{background:var(--gold);border-color:var(--gold)}
.tcard-status{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;
  font-size:var(--font-sm);color:var(--muted)}
/* ===================== find cards ===================== */
.find-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:8px}
.fcard{position:relative;padding:12px;border:1px solid var(--line);border-left:3px solid var(--muted);
  border-radius:var(--radius-lg);background:var(--surface)}
.fcard-ico{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--radius-md);margin-bottom:10px;
  background:var(--surface-soft);color:var(--muted)}
.fcard-ico svg{width:21px;height:21px}
.fcard-name{font-size:var(--font-body);font-weight:800;overflow-wrap:anywhere}
.fcard-effect{font-size:var(--font-sm);line-height:1.5;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.fcard-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fcard.tone-sand{border-left-color:var(--bronze)}   .fcard.tone-sand .fcard-ico{background:rgba(186,149,99,.16);color:var(--bronze)}
.fcard.tone-blue{border-left-color:var(--iv-blue)}  .fcard.tone-blue .fcard-ico{background:var(--iv-blue-soft);color:var(--iv-blue-dark)}
.fcard.tone-gold{border-left-color:var(--gold)}     .fcard.tone-gold .fcard-ico{background:rgba(217,168,0,.16);color:#8a6d00}
.fcard.tone-yellow{border-left-color:var(--warning)}.fcard.tone-yellow .fcard-ico{background:var(--warning-soft);color:#8a6100}
.fcard.tone-purple{border-left-color:var(--purple)} .fcard.tone-purple .fcard-ico{background:var(--purple-soft);color:var(--purple)}
.fcard.tone-orange{border-left-color:#e07b1f}       .fcard.tone-orange .fcard-ico{background:#fff0e0;color:#a75a10}
body[data-theme="dark"] .fcard.tone-orange .fcard-ico{background:#3a2712;color:#f0a75e}
body[data-theme="dark"] .fcard.tone-gold .fcard-ico{color:var(--gold-light)}
/* ===================== result banner (opening outcome) ===================== */
.outcome{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:15px 18px;border-radius:var(--radius-lg);
  border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-sm)}
.outcome-ico{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border-radius:var(--radius-md);
  background:var(--surface-soft);color:var(--muted)}
.outcome-ico svg{width:25px;height:25px}
.outcome.tone-gold{border-color:rgba(217,168,0,.5);background:linear-gradient(150deg,rgba(242,212,107,.18),var(--surface))}
.outcome.tone-gold .outcome-ico{background:rgba(217,168,0,.18);color:#8a6d00}
.outcome.tone-purple .outcome-ico{background:var(--purple-soft);color:var(--purple)}
.outcome.tone-sand .outcome-ico{background:rgba(186,149,99,.16);color:var(--bronze)}
.outcome-title{font-size:var(--font-h3);font-weight:900;letter-spacing:-.02em;overflow-wrap:anywhere}
.outcome-meta{font-size:var(--font-sm);color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.outcome-extra{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
/* find result card shown alongside a treasure result */
.find-result{display:flex;align-items:center;gap:11px;padding:11px 13px;margin-top:11px;border-radius:var(--radius-md);
  border:1px solid rgba(77,73,190,.3);background:var(--purple-soft)}
.find-result .fr-ico{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:10px;
  background:var(--surface);color:var(--purple)}
.find-result .fr-ico svg{width:19px;height:19px}
.find-result b{font-size:13.5px}
.find-result span{display:block;font-size:var(--font-sm);color:var(--muted);margin-top:2px;overflow-wrap:anywhere}

/* ===================== layout ===================== */
.wrap{max-width:var(--content-max);margin:0 auto;padding:14px 16px calc(72px + env(safe-area-inset-bottom))}
/* ---- header (spec 10) ---- */
.appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;min-height:70px;padding:10px 16px 0;
  border:0;background:color-mix(in srgb,var(--page-bg) 90%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:calc(10px + env(safe-area-inset-top))}
.appbar-inner{width:100%;max-width:var(--content-max);min-height:54px;margin:0 auto;padding:7px 11px;display:flex;align-items:center;gap:12px;
  border:1px solid var(--line);border-radius:var(--radius-xl);background:var(--surface);box-shadow:var(--shadow-sm)}
.wordmark{font-size:20px;font-weight:900;letter-spacing:-.045em;color:var(--iv-blue);line-height:1}
.bar-divider{width:1px;height:30px;background:var(--line);flex:0 0 1px}
.app-name{font-size:var(--font-body-lg);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.spacer{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:7px 10px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface-soft);font-size:var(--font-sm);font-weight:800;color:var(--muted)}
.live i{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--disabled)}
.live.ok i{background:var(--success);box-shadow:0 0 0 4px rgba(44,200,77,.16)}
.live.err i{background:var(--danger)}
.picker{display:flex;align-items:center;gap:8px}
.picker.is-empty{display:none!important}
.picker select{min-width:170px;max-width:260px;min-height:36px;padding:7px 11px;border:1px solid var(--line);
  border-radius:var(--radius-md);background:var(--surface);font-size:var(--font-body);font-weight:700;outline:none}
.theme-toggle{display:flex;gap:3px;padding:3px;border-radius:var(--radius-md);background:var(--surface-soft)}
.theme-toggle button{min-height:34px;min-width:36px;border:0;background:transparent;color:var(--muted);
  border-radius:var(--radius-sm);font-size:var(--font-sm);font-weight:800;display:grid;place-items:center}
.theme-toggle button svg{width:18px;height:18px}
.theme-toggle button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.burger{display:none}
/* ---- hero (spec 12 top block) ---- */
.hero{position:relative;overflow:hidden;isolation:isolate;padding:18px 20px;margin-bottom:10px;border:1px solid var(--line);border-radius:var(--radius-xl);
  color:var(--text);background:var(--surface);box-shadow:var(--shadow-sm)}
.hero:before{content:"";position:absolute;z-index:-1;right:-70px;top:-100px;width:230px;height:230px;border-radius:50%;
  border:32px solid rgba(37,104,219,.035)}
.hero:after{content:"";position:absolute;z-index:-1;right:24px;bottom:-72px;width:190px;height:190px;opacity:.09;
  background:radial-gradient(circle,var(--gold),transparent 64%)}
.hero-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.hero h1{font-size:clamp(24px,3vw,30px);font-weight:900;letter-spacing:-.035em;line-height:1.08;overflow-wrap:anywhere}
.hero-dates{font-size:12.5px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.hero-banner{font-size:13px;line-height:1.45;color:var(--muted);margin-top:7px;max-width:640px;overflow-wrap:anywhere}
.hero-next{flex:0 0 auto;min-width:220px;padding:11px 13px;border-radius:var(--radius-lg);
  background:var(--surface-soft);border:1px solid var(--line)}
.hero-next .lbl{font-size:var(--font-xs);font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.hero-next .val{font-size:16px;font-weight:900;margin-top:4px;overflow-wrap:anywhere}
.hero-next .sub{font-size:var(--font-sm);color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.hero .badge{background:var(--success-soft);color:#15803d}
/* ---- main grid (spec 12) ---- */
.board-grid{display:grid;grid-template-columns:minmax(0,66fr) minmax(300px,34fr);gap:10px;align-items:start;margin-top:10px}
.board-grid>*,.bottom-grid>*{min-width:0}
.section-gap{margin-top:10px}
.bottom-grid{display:grid;grid-template-columns:1.65fr 1fr;gap:10px;margin-top:10px}
.progress-line{height:8px;border-radius:999px;background:var(--surface-soft);overflow:hidden;margin:10px 0 8px}
.progress-line span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--gold-light));transition:width .4s ease}
/* ---- timeline / lists ---- */
.timeline{display:grid;gap:7px}
.tl-item{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;
  border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
.tl-ico{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--surface-soft);color:var(--muted)}
.tl-ico svg{width:19px;height:19px}
.tl-ico.tone-gold{background:rgba(217,168,0,.16);color:#8a6d00}
.tl-ico.tone-purple{background:var(--purple-soft);color:var(--purple)}
.tl-ico.tone-sand{background:rgba(186,149,99,.16);color:var(--bronze)}
.tl-name{font-size:13.5px;font-weight:800;overflow-wrap:anywhere}
.tl-meta{font-size:var(--font-sm);color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.tl-right{font-size:var(--font-sm);color:var(--muted);text-align:right;white-space:nowrap}
.rank{display:grid;gap:7px}
.rank-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 12px;
  border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
.rank-pos{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--surface-soft);
  font-size:13px;font-weight:900;color:var(--muted)}
.rank-row:first-child .rank-pos{background:rgba(217,168,0,.18);color:#8a6d00}
.rank-name{font-size:13.5px;font-weight:800;overflow-wrap:anywhere}
.rank-val{font-size:13px;font-weight:800;color:var(--iv-blue-dark);white-space:nowrap}
.more-list{margin-top:2px}
.more-list summary{display:flex;align-items:center;justify-content:flex-end;min-height:36px;list-style:none;cursor:pointer;
  color:var(--iv-blue-dark);font-size:11.5px;font-weight:800}
.more-list summary::-webkit-details-marker{display:none}
.more-list summary:after{content:" →";margin-left:4px}
.more-list[open] summary:after{content:" ↑"}
.more-list .tl-item,.more-list .rank-row{margin-top:7px}
.more-list .rank-pos{background:var(--surface-soft)!important;color:var(--muted)!important}
.empty-note{font-size:13px;color:var(--muted);line-height:1.55}
.boot{display:grid;place-items:center;min-height:60vh;text-align:center;padding:40px 20px}
.boot h2{font-size:var(--font-h2);font-weight:900;letter-spacing:-.02em}
.boot p{color:var(--muted);line-height:1.6;margin-top:8px}
.hash{padding:14px 16px;border-radius:var(--radius-md);background:var(--iv-navy);color:#d9e9f6;
  font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6;word-break:break-all}
.foot{text-align:center;color:var(--muted);font-size:var(--font-sm);margin:14px 0 20px}
/* ---- tooltip (spec 20) ---- */
.tip{position:fixed;z-index:900;max-width:280px;padding:12px 14px;border-radius:var(--radius-md);background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow-md);pointer-events:none}
.tip-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900}
.tip-head svg{width:16px;height:16px;flex:0 0 16px;color:var(--muted)}
.tip-body{font-size:var(--font-sm);color:var(--muted);line-height:1.45;margin-top:5px}
.tip-time{font-size:var(--font-xs);color:var(--disabled);margin-top:6px}
.tip-arrow{position:absolute;width:12px;height:12px;background:var(--surface);transform:translateX(-50%) rotate(45deg);
  bottom:-7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tip.below .tip-arrow{top:-7px;bottom:auto;border:0;border-left:1px solid var(--line);border-top:1px solid var(--line)}
/* ---- mobile bottom nav (spec 25) ---- */
.bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;
  border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav ul{display:flex;list-style:none}
.bottom-nav li{flex:1}
.bottom-nav button{width:100%;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:800}
.bottom-nav button svg{width:21px;height:21px}
.bottom-nav button[aria-current="true"]{color:var(--iv-blue)}
/* ===================== responsive ===================== */
@media(max-width:860px){.board-grid{grid-template-columns:minmax(0,1fr)}.bottom-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){
  .wrap{padding:8px 8px calc(72px + env(safe-area-inset-bottom))}
  .appbar{padding:0;min-height:52px;border-bottom:1px solid var(--line);background:var(--surface);padding-top:env(safe-area-inset-top)}
  .appbar-inner{min-height:52px;padding:4px 10px;border:0;border-radius:0;box-shadow:none;gap:9px}
  .wordmark{font-size:18px}.app-name{display:block;font-size:12px}.bar-divider{height:22px}
  .appbar-inner{flex-wrap:wrap}
  .live,.theme-toggle{display:none}
  .picker{display:none}
  .appbar.picker-open .picker{display:flex;flex:1 1 100%;order:9}
  .appbar.picker-open .picker select{flex:1;min-width:0;max-width:none}
  .burger{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;border:0;
    border-radius:var(--radius-md);background:var(--surface);color:var(--text);margin-left:auto}
  .burger.hidden{display:none!important}
  .burger svg{width:21px;height:21px}
  .hero{display:none}
  .panel{padding:12px;border-radius:var(--radius-lg)}
  .kpi-row{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .kpi{min-height:55px;padding:7px 6px;gap:5px;border-radius:9px;box-shadow:none}
  .kpi-ico{width:21px;height:21px;flex-basis:21px;border-radius:6px}.kpi-ico svg{width:13px;height:13px}
  .kpi-label,.kpi-meta{display:none}.kpi-value{font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi-value small{font-size:9px}.outcome{display:none}
  .board-grid{gap:8px;margin-top:8px}
  .board-grid .panel-title{margin-bottom:5px;font-size:15px}.board-grid .panel-sub{display:none}
  .board-grid .panel:first-child{padding:9px}
  .cell{width:44px;height:44px;min-width:44px;min-height:44px}
  .cell-mark{width:17px;height:17px;top:50%;transform:translate(-50%,-50%)}
  .cell-who{font-size:8px}
  .map-frame{padding:8px;margin:0}
  .map-scroll{padding:1px 0 5px}
  .map-rose{display:none}
  .map-legend{gap:4px;margin-top:8px}.map-legend span{padding:5px 6px;font-size:10px}
  .more-list summary{min-height:44px}
  .bottom-nav{display:block}
  .tl-item{grid-template-columns:34px minmax(0,1fr)}
  .tl-right{grid-column:1/-1;text-align:left}
  .mobile-pane{display:none}
  .mobile-pane.is-active{display:block}
}
@media(max-width:400px){.wrap{padding:7px 6px calc(70px + env(safe-area-inset-bottom))}.kpi{padding:6px 4px;gap:4px}.kpi-value{font-size:13px}.bottom-nav button{font-size:9.5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

<div class="tip hidden" id="tip" role="tooltip"><div class="tip-head"></div><div class="tip-body"></div><div class="tip-time"></div><div class="tip-arrow"></div></div>
<div class="sr-only" id="liveRegion" role="status" aria-live="polite"></div>
<script>
'use strict';
const cfg=window.IVIDEON_SEABATTLE_CONFIG||{};
const sb=(window.supabase&&cfg.supabaseUrl&&cfg.supabasePublishableKey)?window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
const PUBLIC_GAME_KEY='ivideon_seabattle_public_game';
const PUBLIC_CACHE_PREFIX='ivideon_seabattle_public_cache_';
const THEME_KEY='ivideon_seabattle_theme';

/* Совместимость: внутренние ключи снимка (ships/shots/perk) прежние —
   меняется только то, что видит участник. */
const TREASURE_NAMES={1:'Драгоценный камень',2:'Старинный сундук',3:'Коллекция артефактов',4:'Королевская сокровищница',5:'Затерянный клад'};
const TREASURE_ICONS={1:'i-gem',2:'i-chest',3:'i-scroll',4:'i-chest',5:'i-map'};
const LEGACY_TREASURE_NAMES={'Катер':1,'Эсминец':2,'Крейсер':3,'Линкор':4,'Флагман':5};
const LEGACY_FIND_LABELS={'Плюшка':'Неожиданная находка','Повторный выстрел':'Дополнительное открытие сектора'};
const FIND_ICON_TONE={'i-shovel':'sand','i-compass':'blue','i-key':'gold','i-coin':'yellow','i-mapfrag':'purple','i-lantern':'orange','i-chest':'gold'};
const EFFECT_PUBLIC={extra_opening:'Дополнительное открытие сектора',instant_prize:'Мгновенная награда',
  adjacent_hint:'Подсказка о соседних секторах',row_hint:'Подсказка по строке',column_hint:'Подсказка по столбцу',
  inspect_without_open:'Проверка сектора без открытия',manual_effect:'Награда от администратора',none:''};

let activeCell=null,selectedGameId=new URLSearchParams(location.search).get('game')||'',catalog=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const col=i=>String.fromCharCode(65+i);
const shortName=n=>(n||'').trim().split(/\s+/)[0].slice(0,7);
const ico=id=>'<svg aria-hidden="true"><use href="#'+id+'"/></svg>';
const dt=ts=>{if(!ts)return '—';try{return new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return '—'}};
const dOnly=ts=>{if(!ts)return '—';try{return new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return '—'}};
const fmtD=iso=>{if(!iso)return '';const p=String(iso).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:String(iso)};

function setLive(mode,text){const el=document.getElementById('live');el.className='live '+(mode||'');document.getElementById('liveText').textContent=text}
function theme(t){document.body.dataset.theme=t;try{localStorage.setItem(THEME_KEY,t)}catch(e){}
  document.getElementById('lightBtn').classList.toggle('active',t==='light');
  document.getElementById('darkBtn').classList.toggle('active',t==='dark')}
document.getElementById('lightBtn').onclick=()=>theme('light');
document.getElementById('darkBtn').onclick=()=>theme('dark');
let initialTheme='light';try{initialTheme=localStorage.getItem(THEME_KEY)||'light'}catch(e){}
theme(initialTheme);

function treasureByName(g,name){return (g&&g.ships||[]).find(t=>(t.name||'').trim()===(name||'').trim())||null}
function treasureName(t){if(!t)return '';const n=(t.name||'').trim();
  if(n&&LEGACY_TREASURE_NAMES[n]===Number(t.size))return TREASURE_NAMES[t.size]||n;
  return n||TREASURE_NAMES[t.size]||'Сокровище'}
function treasureIcon(t){return TREASURE_ICONS[Number(t&&t.size)||1]||'i-chest'}
function findLabel(raw){const v=(raw||'').trim();if(!v)return 'Неожиданная находка';return LEGACY_FIND_LABELS[v]||v}
function normalizeLegacyPublicText(raw){
  return String(raw||'')
    .replace(/морской бой/giu,'Карта сокровищ')
    .replace(/выстрелами/giu,'открытиями')
    .replace(/выстрелов/giu,'открытий')
    .replace(/выстрелы/giu,'открытия')
    .replace(/выстрела/giu,'открытия')
    .replace(/выстрел/giu,'открытие');
}

/* Безопасная находка из публичного снимка.
   Читается только то, что снимок отдаёт по уже открытому сектору;
   если сервер ещё не передаёт эти поля, блок просто не отображается. */
function openingFind(s){
  if(!s)return null;
  const name=s.findLabel||s.findName||(s.result==='perk'?s.perkLabel:null);
  if(!name)return null;
  const iconId=s.findIcon&&/^i-[a-z]+$/.test(s.findIcon)?s.findIcon:'i-compass';
  return{name:findLabel(name),desc:s.findDesc||'',icon:iconId,
    effect:s.findEffectPublic||EFFECT_PUBLIC[s.findEffect]||'',
    prize:s.findPrize||'',
    tone:FIND_ICON_TONE[iconId]||'purple'};
}
function stateGames(state){if(!state)return[];if(Array.isArray(state.games))return state.games;if(state.game)return[state.game];return[]}
function metrics(g){
  const list=Array.isArray(g.metrics)&&g.metrics.length?g.metrics:[
    {id:'calls',label:'Успешные звонки',unit:'шт.',enabled:true,thresholdEnabled:!!g.threshold,threshold:Number(g.threshold||0)},
    {id:'revenue',label:'Выручка',unit:'₽',enabled:true,thresholdEnabled:false,threshold:0}];
  return list.filter(m=>m.enabled!==false);
}
function metricValue(s,id){
  if(s.metricValues&&s.metricValues[id]!==undefined&&s.metricValues[id]!==null)return Number(s.metricValues[id]);
  if(id==='calls'&&s.calls!==undefined&&s.calls!==null)return Number(s.calls);
  if(id==='revenue'&&s.revenue!==undefined&&s.revenue!==null)return Number(s.revenue);
  return null;
}
function fmtMetric(m,v){if(v===null||v===undefined||v===''||Number.isNaN(Number(v)))return '—';return Number(v).toLocaleString('ru-RU')+(m.unit?' '+m.unit:'')}
function latestWeeklyRanking(g){const last=(g.shots||[]).slice().reverse().find(s=>Array.isArray(s.weeklyResults)&&s.weeklyResults.length);return last?last.weeklyResults.slice().sort((a,b)=>Number(b.eligible)-Number(a.eligible)||Number(b.revenue)-Number(a.revenue)||Number(b.attainment)-Number(a.attainment)):[]}

function aggregate(g){
  const defs=metrics(g),map={};
  const fresh=name=>({name,openings:0,fragments:0,found:0,finds:0,metricTotals:{}});
  (g.managers||[]).forEach(x=>map[x]=fresh(x));
  (g.shots||[]).forEach(s=>{
    if(!map[s.manager])map[s.manager]=fresh(s.manager);
    const r=map[s.manager];r.openings++;
    defs.forEach(m=>{const v=metricValue(s,m.id);if(v!==null)r.metricTotals[m.id]=(r.metricTotals[m.id]||0)+v});
    if(s.result==='hit'){r.fragments++;if(s.finalBlow)r.found++}
    else if(s.result==='perk')r.finds++;
    if(s.result!=='perk'&&openingFind(s))r.finds++;
  });
  return Object.values(map);
}
function leader(rows,key){let best=null;rows.forEach(r=>{if(r[key]>0&&(!best||r[key]>best[key]))best=r});return best}

/* Состояние сектора (spec 16) */
function sectorState(s,g){
  if(!s)return null;
  const find=openingFind(s);
  if(s.result==='hit'){
    const complete=!!s.finalBlow||!!s.inSunkShip;
    const t=s.shipName?(treasureByName(g,s.shipName)||{name:s.shipName,size:s.shipSize}):null;
    const nm=t?treasureName(t):'';
    return{kind:complete?'complete':'fragment',cls:complete?'st-complete':'st-fragment',
      icon:complete?treasureIcon(t||{size:2}):'i-gem',tone:'gold',
      title:complete?'Сокровище найдено полностью':'Найден фрагмент сокровища',
      detail:nm?(complete?nm:'фрагмент: '+nm):'',treasure:nm,find};
  }
  if(s.result==='perk')
    return{kind:'find',cls:'st-find',icon:(find&&find.icon)||'i-compass',tone:'purple',
      title:'Найдена неожиданная находка',detail:find?find.name:'',treasure:'',find};
  return{kind:'empty',cls:'st-empty',icon:'i-empty',tone:'sand',
    title:'Пустой сектор',detail:'Следов сокровища нет',treasure:'',find};
}
function cellAria(r,c,st){
  const coord='Сектор '+col(c)+(r+1)+'. ';
  if(!st)return coord+'Сектор ещё не исследован.';
  let t=coord+st.title;
  if(st.treasure)t+=' «'+st.treasure+'»';
  if(st.find)t+='. Неожиданная находка: '+st.find.name;
  return t+'.';
}
function boardHTML(g){
  const n=g.size||8,shots=g.shots||[];
  let h='<table class="brd"><caption class="sr-only">Карта '+n+'×'+n+'. Открыты только исследованные секторы.</caption><tr><th></th>';
  for(let c=0;c<n;c++)h+='<th scope="col">'+col(c)+'</th>';
  h+='</tr>';
  for(let r=0;r<n;r++){
    h+='<tr><th scope="row">'+(r+1)+'</th>';
    for(let c=0;c<n;c++){
      const s=shots.find(x=>x.r===r&&x.c===c),st=sectorState(s,g);
      if(!st){h+='<td class="cell" aria-label="'+esc(cellAria(r,c,null))+'"></td>';continue}
      let inner='<span class="cell-mark">'+ico(st.icon)+'</span><span class="cell-who">'+esc(shortName(s.manager))+'</span>';
      if(st.find&&st.kind!=='find')
        inner+='<span class="cell-badge tone-'+(st.find.tone==='gold'?'gold':st.find.tone==='blue'?'':'')+'">'+ico(st.find.icon)+'</span>';
      h+='<td tabindex="0" class="cell is-open '+st.cls+'" aria-label="'+esc(cellAria(r,c,st))+'"'+
        ' data-name="'+esc(s.manager)+'" data-title="'+esc(st.title)+'" data-detail="'+esc(st.detail)+'"'+
        ' data-find="'+esc(st.find?st.find.name+(st.find.effect?' · '+st.find.effect:''):'')+'"'+
        ' data-icon="'+esc(st.icon)+'" data-time="'+esc(dt(s.ts))+'">'+inner+'</td>';
    }
    h+='</tr>';
  }
  return h+'</table>';
}
function kpi(iconId,tone,label,value,meta){
  return '<div class="kpi"><div class="kpi-ico tone-'+tone+'">'+ico(iconId)+'</div><div class="kpi-body">'+
    '<div class="kpi-label">'+esc(label)+'</div><div class="kpi-value">'+value+'</div>'+
    (meta?'<div class="kpi-meta">'+meta+'</div>':'')+'</div></div>';
}
function cachedGame(id){try{return JSON.parse(localStorage.getItem(PUBLIC_CACHE_PREFIX+id)||'null')}catch(e){return null}}
function cacheGame(id,state,updatedAt){try{localStorage.setItem(PUBLIC_CACHE_PREFIX+id,JSON.stringify({state,updatedAt}))}catch(e){}}
function chooseGameId(){
  let id=selectedGameId;try{id=id||localStorage.getItem(PUBLIC_GAME_KEY)||''}catch(e){}
  if(!catalog.some(x=>x.game_id===id))id=catalog[0]?.game_id||'';
  selectedGameId=id;
  if(id){try{localStorage.setItem(PUBLIC_GAME_KEY,id)}catch(e){}}
  return id;
}
function renderPicker(){
  const s=document.getElementById('gameSelect');
  s.innerHTML=catalog.map(x=>'<option value="'+esc(x.game_id)+'">'+esc(x.title||'Игра')+'</option>').join('');
  s.value=selectedGameId||'';
  s.disabled=catalog.length<2;
  syncBurger();
  s.parentElement.classList.toggle('is-empty',!catalog.length);
  s.onchange=()=>{selectedGameId=s.value;
    try{localStorage.setItem(PUBLIC_GAME_KEY,selectedGameId)}catch(e){}
    history.replaceState({},'',selectedGameId?'?game='+encodeURIComponent(selectedGameId):location.pathname);
    loadSelectedGame(true)};
}
function render(state,dbTime){
  const games=stateGames(state);
  if(!games.length){
    document.getElementById('content').innerHTML='<div class="boot"><h2>Карты ещё не опубликованы</h2><p>Owner или администратор должен активировать хотя бы одну игру.</p></div>';
    document.getElementById('gameSelect').parentElement.classList.add('is-empty');
    setLive('','Ожидаем данные');return;
  }
  const g=games[0];
  renderPicker();
  const defs=metrics(g),rows=aggregate(g),shots=g.shots||[],last=shots.at(-1);
  const treasures=g.ships||[];
  const foundCount=treasures.filter(t=>t.sunk).length;
  const totalCells=(g.size||8)*(g.size||8);
  const findCount=shots.filter(s=>openingFind(s)).length;
  const lead=leader(rows,'found')||leader(rows,'fragments')||leader(rows,'openings');
  const leadMetric=defs[1]||defs[0];
  const gates=defs.filter(m=>m.thresholdEnabled).map(m=>'≥'+fmtMetric(m,m.threshold)+' '+m.label);
  const publicBanner=normalizeLegacyPublicText(g.banner);

  /* --- hero --- */
  const period=last&&(last.periodStart||last.periodEnd)?fmtD(last.periodStart)+' — '+fmtD(last.periodEnd):'';
  const hero='<section class="hero"><div class="hero-top"><div style="flex:1;min-width:240px">'+
    '<span class="badge badge-active">'+ico('i-check')+(g.sealed?'Игра идёт':'Готовится к старту')+'</span>'+
    '<h1 style="margin-top:10px">'+esc(g.name||'Карта сокровищ')+'</h1>'+
    (publicBanner&&publicBanner!==g.name?'<div class="hero-banner">'+esc(publicBanner)+'</div>':'')+
    (gates.length?'<div class="hero-dates">Допуск к открытию: '+esc(gates.join(' · '))+'</div>':'')+
    '</div><div class="hero-next"><div class="lbl">Последнее открытие</div>'+
    '<div class="val">'+(last?esc(dOnly(last.ts)):'—')+'</div>'+
    '<div class="sub">'+(last?esc(last.scenarioName||'Ручное событие')+(period?' · '+esc(period):''):'Ещё не проводилось')+'</div>'+
    '</div></div></section>';

  /* --- KPI (spec 12) --- */
  const kpis='<div class="kpi-row" id="pane-kpi">'+
    kpi('i-marker','sand','Открыто секторов','<span>'+shots.length+'</span> <small>/ '+totalCells+'</small>','')+
    kpi('i-chest','gold','Найдено сокровищ','<span>'+foundCount+'</span> <small>/ '+treasures.length+'</small>','')+
    kpi('i-compass','purple','Неожиданные находки',String(findCount),'')+
    kpi('i-trophy','gold','Лидер периода',esc(lead?lead.name:'—'),
      lead&&leadMetric?esc(fmtMetric(leadMetric,lead.metricTotals[leadMetric.id]||0)):'нет данных')+
    '</div>';

  /* --- map + treasures --- */
  const collection=treasures.length?treasures.slice().sort((a,b)=>a.size-b.size).map(t=>{
    const size=Number(t.size||1),hits=Number(t.hits||0),done=!!t.sunk;
    let segs='';for(let i=0;i<size;i++)segs+='<i class="'+(i<hits?'on':'')+'"></i>';
    return '<div class="tcard'+(done?' is-found':'')+'"><div class="tcard-ico">'+ico(done?treasureIcon(t):'i-gem')+'</div><div>'+
      '<div class="tcard-top"><span class="tcard-name">'+esc(treasureName(t))+'</span><span class="tcard-size">'+size+(size===1?' сектор':size<5?' сектора':' секторов')+'</span></div>'+
      '<div class="seg" role="img" aria-label="Найдено '+hits+' из '+size+' фрагментов">'+segs+'</div>'+
      '<div class="tcard-prize">'+(done?'<b>Награда:</b> '+esc(t.prize||'—'):'<span style="color:var(--muted)">Награда откроется после полного обнаружения</span>')+'</div>'+
      '<div class="tcard-status"><span>'+hits+' / '+size+' фрагментов</span>'+
      (done?'<span class="badge badge-gold">'+ico('i-check')+'Найдено</span>':'')+'</div></div></div>';
  }).join(''):'<div class="empty-note">Сокровища ещё не размещены.</div>';

  const mapBlock='<section class="panel mobile-pane is-active" data-pane="overview map"><div class="panel-title">'+ico('i-map')+'Карта</div>'+
    '<div class="panel-sub">Открыты только исследованные секторы. Расположение ненайденных сокровищ скрыто до финала.</div>'+
    (g.sealed?'<div class="map-scroll"><div class="map-frame">'+boardHTML(g)+
      '<div class="map-rose">'+ico('i-rose')+'</div></div></div>'+
      '<div class="map-legend"><span><i class="lg-fragment"></i>Фрагмент сокровища</span>'+
      '<span><i class="lg-empty"></i>Пустой сектор</span>'+
      '<span><i class="lg-find"></i>Неожиданная находка</span>'+
      '<span><i class="lg-complete"></i>Сокровище найдено</span></div>'+
      '<p class="empty-note" style="margin-top:10px">Наведите курсор или нажмите на исследованный сектор — появится имя участника, результат и время.</p>'
      :'<div class="empty-note">Карта готовится к старту.</div>')+'</section>';

  const treasureBlock='<section class="panel mobile-pane is-active" data-pane="overview map"><div class="panel-title">'+ico('i-chest')+'Сокровища</div>'+
    '<div class="panel-sub">Найдено '+foundCount+' из '+treasures.length+'. Награда открывается только после полного обнаружения.</div>'+
    '<div class="progress-line" role="img" aria-label="Прогресс: найдено '+foundCount+' из '+treasures.length+'"><span style="width:'+(treasures.length?Math.round(foundCount/treasures.length*100):0)+'%"></span></div>'+
    '<div class="treasure-list">'+collection+'</div></section>';

  /* --- bottom: openings / rating / finds --- */
  const recent=shots.slice(-8).reverse();
  const openingRows=recent.map(s=>{
    const st=sectorState(s,g);
    return '<div class="tl-item"><div class="tl-ico tone-'+st.tone+'">'+ico(st.icon)+'</div>'+
      '<div><div class="tl-name">'+esc(s.manager)+' → '+esc(col(s.c)+(s.r+1))+'</div>'+
      '<div class="tl-meta">'+esc(st.title)+(st.detail?' · '+esc(st.detail):'')+
      (st.find&&st.kind!=='find'?' · находка: '+esc(st.find.name):'')+'</div></div>'+
      '<div class="tl-right">'+esc(dOnly(s.ts))+'</div></div>';
  });
  const openings=openingRows.length?openingRows.slice(0,3).join('')+
    (openingRows.length>3?'<details class="more-list"><summary>Вся история</summary>'+openingRows.slice(3).join('')+'</details>':''):
    '<div class="empty-note">Открытий ещё не было.</div>';

  const weeklyRanked=latestWeeklyRanking(g),ranked=weeklyRanked.length?weeklyRanked:rows.slice().sort((a,b)=>b.found-a.found||b.fragments-a.fragments||b.openings-a.openings).slice(0,8);
  const ratingRows=ranked.map((r,i)=>
    '<div class="rank-row"><div class="rank-pos">'+(i+1)+'</div>'+
    '<div><div class="rank-name">'+esc(r.name)+'</div>'+
    '<div class="tl-meta">'+(weeklyRanked.length?(r.workedDays+' дн. · норма '+r.personalTarget+' · факт '+r.calls+' · '+Number(r.attainment||0).toLocaleString('ru-RU',{maximumFractionDigits:1})+'% · '+(r.eligible?'допущен':'не допущен')):(r.openings+' откр. · '+r.fragments+' фрагм. · '+r.found+' сокр.'))+'</div></div>'+
    '<div class="rank-val">'+(weeklyRanked.length?(Number(r.revenue)||0).toLocaleString('ru-RU')+' ₽':(leadMetric?esc(fmtMetric(leadMetric,r.metricTotals[leadMetric.id]||0)):''))+'</div></div>'
  );
  const rating=ratingRows.length?ratingRows.slice(0,3).join('')+
    (ratingRows.length>3?'<details class="more-list"><summary>Полный рейтинг</summary>'+ratingRows.slice(3).join('')+'</details>':''):
    '<div class="empty-note">Пока нет данных.</div>';

  const foundFinds=shots.map(s=>({s,f:openingFind(s)})).filter(x=>x.f).reverse();
  const finds=foundFinds.length?'<div class="find-grid">'+foundFinds.map(({s,f})=>
    '<div class="fcard tone-'+f.tone+'"><div class="fcard-ico">'+ico(f.icon)+'</div>'+
    '<div class="fcard-name">'+esc(f.name)+'</div>'+
    (f.effect?'<div class="fcard-effect">'+esc(f.effect)+'</div>':(f.desc?'<div class="fcard-effect">'+esc(f.desc)+'</div>':''))+
    (f.prize?'<div class="fcard-effect"><b>Награда:</b> '+esc(f.prize)+'</div>':'')+
    '<div class="fcard-meta"><span class="badge badge-muted">'+esc(s.manager)+'</span>'+
    '<span class="badge badge-muted">'+esc(col(s.c)+(s.r+1))+'</span></div></div>').join('')+'</div>'
    :'<div class="empty-note">Неожиданных находок пока не обнаружено.</div>';

  /* --- last outcome banner --- */
  let outcome='';
  if(last){
    const st=sectorState(last,g);
    const meta=defs.map(m=>{const v=metricValue(last,m.id);return v===null?null:m.label+': '+fmtMetric(m,v)}).filter(Boolean);
    if(last.passedGate===true)meta.push('допуск пройден');else if(last.passedGate===false)meta.push('ниже порога');
    outcome='<div class="outcome tone-'+st.tone+'" style="margin-top:10px"><div class="outcome-ico">'+ico(st.icon)+'</div>'+
      '<div style="flex:1;min-width:200px"><div class="outcome-title">'+esc(st.title)+'</div>'+
      '<div class="outcome-meta">'+esc(last.manager)+' → сектор '+esc(col(last.c)+(last.r+1))+
      (st.detail?' · '+esc(st.detail):'')+(meta.length?' · '+esc(meta.join(' · ')):'')+' · '+esc(dt(last.ts))+'</div>'+
      (st.find&&st.kind!=='find'?'<div class="find-result"><div class="fr-ico">'+ico(st.find.icon)+'</div>'+
        '<div><b>Неожиданная находка: '+esc(st.find.name)+'</b>'+
        (st.find.effect?'<span>'+esc(st.find.effect)+'</span>':(st.find.desc?'<span>'+esc(st.find.desc)+'</span>':''))+
        (st.find.prize?'<span>Награда: '+esc(st.find.prize)+'</span>':'')+
        '</div></div>':'')+
      '</div><div class="outcome-extra"><span class="badge badge-blue">'+esc(last.scenarioName||'Ручное событие')+'</span></div></div>';
  }

  document.getElementById('content').innerHTML=hero+kpis+outcome+
    '<div class="board-grid">'+mapBlock+treasureBlock+'</div>'+
    '<div class="bottom-grid">'+
    '<section class="panel mobile-pane" data-pane="history"><div class="panel-title">'+ico('i-journal')+'Последние открытия</div><div class="timeline">'+openings+'</div></section>'+
    '<section class="panel mobile-pane" data-pane="rating"><div class="panel-title">'+ico('i-trophy')+'Рейтинг участников</div><div class="rank">'+rating+'</div></section>'+
    '</div>'+
    '<section class="panel section-gap mobile-pane" data-pane="finds"><div class="panel-title">'+ico('i-compass')+'Найденные неожиданные находки</div>'+
    '<div class="panel-sub">Находки, которые уже обнаружены участниками. Скрытые находки не раскрываются.</div>'+finds+'</section>'+
    (g.hash?'<section class="panel section-gap mobile-pane" data-pane="overview"><div class="panel-title">'+ico('i-lock')+'Отпечаток карты</div>'+
      '<div class="panel-sub">Карта зафиксирована на старте. Совпадение отпечатка подтверждает, что сокровища не перемещали.</div>'+
      '<div class="hash">'+esc(g.hash)+'</div></section>':'');

  bindCells();applyPane(currentPane);
  document.getElementById('foot').textContent='Обновлено: '+dt(state.updatedAt||dbTime||Date.now())+' · Ivideon · Карта сокровищ';
  setLive('ok','Обновляется онлайн');
}
/* ---- tooltip ---- */
let tipSource='hover';
function showTip(cell,source){
  const t=document.getElementById('tip');activeCell=cell;tipSource=source||'hover';
  t.querySelector('.tip-head').innerHTML=ico(cell.dataset.icon||'i-marker')+'<span>'+esc(cell.dataset.name||'')+'</span>';
  const parts=[cell.dataset.title,cell.dataset.detail,cell.dataset.find?'Находка: '+cell.dataset.find:''].filter(Boolean);
  t.querySelector('.tip-body').textContent=parts.join(' · ');
  t.querySelector('.tip-time').textContent=cell.dataset.time?'Открыт: '+cell.dataset.time:'';
  t.classList.remove('hidden');
  const r=cell.getBoundingClientRect(),tr=t.getBoundingClientRect();
  let left=Math.max(12,Math.min(r.left+r.width/2-tr.width/2,innerWidth-tr.width-12));
  let top=r.top-tr.height-14,below=false;
  if(top<12){top=r.bottom+14;below=true}
  if(top+tr.height>innerHeight-12)top=Math.max(12,innerHeight-tr.height-12);
  t.style.left=left+'px';t.style.top=top+'px';
  t.classList.toggle('below',below);
  t.querySelector('.tip-arrow').style.left=Math.max(18,Math.min(r.left+r.width/2-left,tr.width-18))+'px';
}
function hideTip(){document.getElementById('tip').classList.add('hidden');activeCell=null;tipSource='hover'}
function bindCells(){
  document.querySelectorAll('.cell.is-open').forEach(c=>{
    c.onmouseenter=()=>showTip(c,'hover');
    // уход курсора не должен гасить подсказку, открытую с клавиатуры
    c.onmouseleave=()=>{if(tipSource==='hover'&&activeCell===c)hideTip()};
    c.onfocus=()=>showTip(c,'focus');
    c.onblur=()=>{if(tipSource==='focus'&&activeCell===c)hideTip()};
    c.onclick=e=>{e.stopPropagation();activeCell===c?hideTip():showTip(c,'tap')};
  });
}
document.addEventListener('click',e=>{if(activeCell&&!e.target.closest('.cell.is-open'))hideTip()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});
addEventListener('resize',()=>{if(activeCell)showTip(activeCell,tipSource)});
addEventListener('scroll',()=>{if(activeCell)showTip(activeCell,tipSource)},true);
/* ---- mobile panes ---- */
let currentPane='overview';
function applyPane(p){
  currentPane=p;
  document.querySelectorAll('#bottomNav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.pane===p)));
  document.querySelectorAll('.mobile-pane').forEach(el=>{
    const own=(el.dataset.pane||'').split(/\s+/).filter(Boolean);
    el.classList.toggle('is-active',own.includes(p));
  });
}
document.querySelectorAll('#bottomNav button').forEach(b=>{
  b.onclick=()=>{applyPane(b.dataset.pane);window.scrollTo({top:0,behavior:'smooth'})};
});
const burger=document.getElementById('burgerBtn');
burger.onclick=()=>{
  const bar=document.querySelector('.appbar');
  const open=!bar.classList.contains('picker-open');
  bar.classList.toggle('picker-open',open);
  burger.setAttribute('aria-expanded',String(open));
  if(open)setTimeout(()=>document.getElementById('gameSelect')?.focus(),0);
};
function syncBurger(){
  // Кнопка нужна только когда есть что выбирать
  burger.classList.toggle('hidden',catalog.length<2);
  if(catalog.length<2){document.querySelector('.appbar').classList.remove('picker-open');burger.setAttribute('aria-expanded','false')}
}
/* ---- data ---- */
let reloadTimer=null;
async function loadCatalog(){
  if(!sb){setLive('err','Ошибка config.js');document.getElementById('content').innerHTML='<div class="boot"><h2>Не удалось подключиться</h2><p>Проверьте config.js.</p></div>';return false}
  const{data,error}=await sb.from('public_games').select('game_id,title,updated_at').order('updated_at',{ascending:false});
  if(error){setLive('err','Ошибка соединения');document.getElementById('content').innerHTML='<div class="boot"><h2>Ошибка загрузки</h2><p>'+esc(error.message)+'</p></div>';return false}
  catalog=data||[];
  if(!catalog.length){render({v:4,games:[]},new Date().toISOString());return false}
  chooseGameId();renderPicker();return true;
}
async function loadSelectedGame(force=false){
  if(!selectedGameId)return;
  const cached=cachedGame(selectedGameId);
  if(cached&&!force){render({v:4,games:[cached.state],updatedAt:cached.updatedAt},cached.updatedAt);setLive('','Обновляем данные…')}
  else setLive('','Загружаем карту…');
  const{data,error}=await sb.from('public_games').select('public_state,updated_at').eq('game_id',selectedGameId).maybeSingle();
  if(error){setLive('err','Ошибка соединения');if(!cached)document.getElementById('content').innerHTML='<div class="boot"><h2>Ошибка загрузки</h2><p>'+esc(error.message)+'</p></div>';return}
  if(!data){const ok=await loadCatalog();if(ok)await loadSelectedGame(true);return}
  const prev=(cached&&cached.state&&(cached.state.shots||[]).length)||0;
  cacheGame(selectedGameId,data.public_state,data.updated_at);
  render({v:4,games:[data.public_state],updatedAt:data.updated_at},data.updated_at);
  const now=((data.public_state&&data.public_state.shots)||[]).length;
  if(force&&now>prev&&prev>0){
    const last=data.public_state.shots.at(-1),st=sectorState(last,data.public_state);
    document.getElementById('liveRegion').textContent=st?st.title+'. '+last.manager+', сектор '+col(last.c)+(last.r+1)+'.':'';
  }
}
async function start(){
  setLive('','Загружаем активные игры…');
  const ok=await loadCatalog();
  if(ok)await loadSelectedGame(false);
  if(!sb)return;
  sb.channel('ivideon-treasure-public-v4').on('postgres_changes',{event:'*',schema:'public',table:'public_games'},payload=>{
    clearTimeout(reloadTimer);
    reloadTimer=setTimeout(async()=>{
      const changedId=payload.new?.game_id||payload.old?.game_id;
      await loadCatalog();
      if(!selectedGameId||changedId===selectedGameId)await loadSelectedGame(true);
    },180);
  }).subscribe(status=>{if(status==='SUBSCRIBED')setLive('ok','Обновляется онлайн')});
  setInterval(()=>loadSelectedGame(true),30000);
}
start();
</script>
